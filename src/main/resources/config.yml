planting:
  delay_ticks: 40
  scan_interval_ticks: 20
  enable_event_listeners_for_item_drops: false
  debug: false
  enable_particles: true
  enable_sound: true
  require_nearest_player_can_build: true
  enable_coreprotect_logging: true

falling_seeds:
  enabled: true
  max_leaf_scan_height: 128
  interval_ticks: 120
  natural_seed_fall_weight: 15
  max_seed_fall_weight: 1000
  max_seeds_per_cycle: 32
  max_chunks_per_cycle_per_player: 10
  consume_leaf_on_seed_spawn: true
  minimum_canopy: 2

  leaf_cache:
    dynamic_scaling_enabled: true
    base_lifespan_ms: 60000
    min_lifespan_ms: 10000
    max_lifespan_ms: 60000

  wind:
    direction_x: 0.1
    direction_z: -0.05
    strength: 1.0

ignore_vegetation:
  enabled: true
  list:
    - flowers
    - small_flowers
    - short_grass
    - tall_grass
    - fern
    - large_fern
    - dead_bush
    - sweet_berry_bush
    - red_mushroom
    - brown_mushroom
    - snow

defaults:
  plant_chance: 0.75
  valid_blocks: [ DIRT, GRASS_BLOCK, PODZOL, COARSE_DIRT, MUD ]
  biome_whitelist: [ ]
  commands: [ ]
  enable_falling_seeds: false # Only works for TREES.
  destroy_item_on_failure: false
  success_particles: [ VILLAGER_HAPPY, HEART, BLOCK_CRACK, ITEM_CRACK ]
  failure_particles: [ SMOKE_NORMAL, CLOUD, BLOCK_CRACK, ITEM_CRACK ]

  success_sound: [ LEVEL_UP, NOTE_PLING ]
  failure_sound: [ DIG_WOOD, DIG_GRASS ]

plantables:

  # --- CUSTOM COMMAND / GAMBLE EXAMPLE --- > COMMANDS SUPPORT PAPI PLACEHOLDERS
  AIR:
    items: [AMETHYST_SHARD]
    plant_chance: 0.20
    valid_blocks: [ OBSIDIAN ]
    commands:
      - 'minecraft:tellraw %nearest_player_name% "&e[AutoRoot] &7I hope the trade-off was worth the exchange!"'
      - '[randomEntry] minecraft:give %nearest_player_name% emerald 1 | minecraft:give %nearest_player_name% gold_ingot 1'
    destroy_item_on_failure: true

  # --- TREES ---


  OAK_SAPLING:
    items: [ OAK_SAPLING, APPLE ]
    valid_blocks: [ ]
    plant_chance: 0.90
    biome_whitelist: [ ]
    enable_falling_seeds: true

